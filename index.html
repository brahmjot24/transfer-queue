<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Transfer Queue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f4f1; --card:#fff; --ink:#14181f; --muted:#667085; --line:#e4e6e1;
  --green:#12a150; --green-d:#0b7a3b; --green-bg:#e8f7ee;
  --amber:#c97a06; --amber-bg:#fff6e5; --red:#c8372d; --red-bg:#fdecea;
  --blue:#2457d6; --blue-bg:#eaf0fd; --navy:#151d2e;
  --r:14px; --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
input,select{font:inherit}
.app{max-width:1320px;margin:0 auto;padding:18px 18px 60px}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;letter-spacing:-.01em}
.logo{width:34px;height:34px;border-radius:10px;background:var(--navy);display:grid;place-items:center}
.logo i{width:12px;height:12px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px rgba(18,161,80,.25)}
.sub{color:var(--muted);font-size:13px;font-weight:500}
.spacer{flex:1}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted)}
.live b{width:8px;height:8px;border-radius:50%;background:#bbb}
.live.on b{background:var(--green);animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.35}}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 6px 5px 12px;font-weight:600;font-size:13px}
.chip small{color:var(--muted);font-weight:500}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 13px;font-weight:600;font-size:13.5px;display:inline-flex;align-items:center;gap:6px;transition:background .12s,border-color .12s}
.btn:hover:not(:disabled){border-color:#c9ccc5;background:#fafaf8}
.btn.sm{padding:5px 9px;font-size:12.5px;border-radius:8px}
.btn.xs{padding:3px 7px;font-size:11.5px;border-radius:7px}
.btn.green{background:var(--green);border-color:var(--green);color:#fff}
.btn.green:hover:not(:disabled){background:var(--green-d)}
.btn.dark{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.dark:hover:not(:disabled){background:#26324a}
.btn.redo{color:var(--red);border-color:#efc4c0}
.btn.redo:hover:not(:disabled){background:var(--red-bg)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover:not(:disabled){background:#ecede9}
.btn.big{padding:14px 18px;font-size:16px;border-radius:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 1px 2px rgba(20,24,31,.04)}
.card-h{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line)}
.card-h h3{margin:0;font-size:15px;font-weight:800}
.card-b{padding:14px 16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.split{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:980px){.grid3,.split{grid-template-columns:1fr}}
.stack{display:flex;flex-direction:column;gap:14px}
.notice{border-radius:12px;padding:12px 16px;font-weight:600;font-size:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.notice.warn{background:var(--amber-bg);color:#7a4a00;border:1px solid #f2d9a6}
.notice.info{background:var(--blue-bg);color:#1b3d94;border:1px solid #c9d6f7}
.notice.err{background:var(--red-bg);color:#8a2018;border:1px solid #f0c3be}
/* banner */
.banner{border-radius:16px;padding:18px 22px;margin-bottom:14px;display:flex;align-items:center;gap:16px;color:#fff}
.banner.next{background:linear-gradient(120deg,#0b7a3b,#12a150)}
.banner.deck{background:linear-gradient(120deg,#a86200,#d98a0b)}
.banner .bi{font-size:30px;line-height:1}
.banner h2{margin:0;font-size:24px;font-weight:800;letter-spacing:-.01em}
.banner p{margin:3px 0 0;opacity:.92;font-weight:500}
.banner.flash{animation:flash 1s ease 3}
@keyframes flash{50%{transform:scale(1.015);box-shadow:0 0 0 8px rgba(18,161,80,.25)}}
/* my spots */
.spots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:14px}
@media (max-width:700px){.spots{grid-template-columns:1fr}}
.spot{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.spot .lab{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.spot .val{font-family:var(--mono);font-size:30px;font-weight:700;margin-top:4px}
.spot .hint{font-size:13px;color:var(--muted);font-weight:500}
.spot.next{background:var(--green-bg);border-color:#9fdcb7}.spot.next .val{color:var(--green-d)}
.spot.deck{background:var(--amber-bg);border-color:#f2d39a}.spot.deck .val{color:var(--amber)}
/* list */
.list{list-style:none;margin:0;padding:0}
.row{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid #f0f1ee;min-height:46px}
.row:last-child{border-bottom:0}
.pos{width:28px;height:28px;flex:none;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-size:12.5px;font-weight:700;background:#f0f1ee;color:#475067}
.row .nm{flex:1;min-width:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .nm small{font-weight:500;color:var(--muted);margin-left:6px}
.row.next{background:var(--green-bg);box-shadow:inset 4px 0 0 var(--green)}
.row.next .pos{background:var(--green);color:#fff}
.row.deck .pos{background:#f6deb0;color:#7a4a00}
.row.me{background:var(--blue-bg);box-shadow:inset 4px 0 0 var(--blue)}
.row.me.next{background:var(--green-bg);box-shadow:inset 4px 0 0 var(--green),inset 0 0 0 2px var(--blue)}
.row.off{opacity:.5}
.row.off .pos{background:transparent;border:1px dashed #c3c6bf;color:#98a0b0;font-size:10px}
.tag{font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:999px}
.tag.g{background:var(--green);color:#fff}.tag.a{background:#f6deb0;color:#7a4a00}.tag.o{background:#eceee9;color:#667085}.tag.b{background:var(--blue);color:#fff}.tag.x{background:#f3e8ff;color:#6b21a8}
.acts{display:flex;gap:4px;flex:none}
.nextup{padding:18px 16px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#f7fcf9,#fff)}
.nextup .l{font-size:12px;font-weight:800;color:var(--green-d);letter-spacing:.08em;text-transform:uppercase}
.nextup .n{font-size:30px;font-weight:800;margin:2px 0 12px;letter-spacing:-.01em}
.nextup .bb{display:flex;gap:8px;flex-wrap:wrap}
.feed{list-style:none;margin:0;padding:0;max-height:420px;overflow:auto}
.feed li{display:flex;gap:10px;padding:8px 16px;border-bottom:1px solid #f0f1ee;font-size:13.5px;align-items:baseline}
.feed li time{font-family:var(--mono);font-size:11.5px;color:var(--muted);flex:none;width:62px}
.feed li.undone{text-decoration:line-through;opacity:.5}
.empty{padding:22px 16px;color:var(--muted);text-align:center;font-size:14px}
/* tabs */
.tabs{display:flex;gap:4px;background:#e7e8e3;padding:4px;border-radius:12px;width:max-content;margin-bottom:14px;flex-wrap:wrap}
.tabs button{border:0;background:transparent;padding:7px 14px;border-radius:9px;font-weight:700;font-size:13.5px;color:#475067}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;padding:8px 12px;border-bottom:1px solid var(--line)}
td{padding:8px 12px;border-bottom:1px solid #f0f1ee}
td.num{font-family:var(--mono);font-weight:700}
.field{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:700;color:#475067}
.inp{border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:#fff;color:var(--ink);font-weight:500;font-size:14px}
.inline{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.stepper{display:inline-flex;align-items:center;gap:6px}
.stepper span{font-family:var(--mono);font-weight:700;min-width:16px;text-align:center}
.switch{position:relative;display:inline-block;vertical-align:middle;width:38px;height:22px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch i{position:absolute;inset:0;border-radius:999px;background:#d3d6cf;transition:.15s}
.switch i:after{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;border-radius:50%;background:#fff;transition:.15s}
.switch input:checked+i{background:var(--green)}
.switch input:checked+i:after{transform:translateX(16px)}
/* login */
.login{max-width:860px;margin:30px auto}
.login h1{font-size:30px;margin:0 0 4px;letter-spacing:-.02em}
.who{margin-top:22px}
.who h4{margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.nb{border:1px solid var(--line);background:#fff;border-radius:12px;padding:14px;text-align:left;font-weight:700;font-size:15px;display:flex;flex-direction:column;gap:2px}
.nb:hover{border-color:var(--navy)}
.nb small{color:var(--muted);font-weight:500;font-size:12px}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(15,20,30,.45);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:#fff;border-radius:18px;width:min(460px,100%);padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.25);max-height:90vh;overflow:auto}
.modal h3{margin:0 0 8px;font-size:19px}
.modal p{margin:0 0 12px;color:#475067;line-height:1.45}
.mfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.pinbox{display:flex;justify-content:center;gap:10px;margin:14px 0}
.pinbox b{width:16px;height:16px;border-radius:50%;border:2px solid #c3c6bf}
.pinbox b.f{background:var(--navy);border-color:var(--navy)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:280px;margin:0 auto}
.keys button{padding:14px;border-radius:12px;border:1px solid var(--line);background:#fafaf8;font-size:19px;font-weight:700;font-family:var(--mono)}
.keys button:hover{background:#f0f1ee}
.perr{color:var(--red);text-align:center;font-weight:700;font-size:13px;min-height:18px}
.pref{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #f0f1ee}
.pref div{flex:1}.pref b{display:block;font-size:14px}.pref small{color:var(--muted);font-size:12.5px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 18px;border-radius:12px;font-weight:600;font-size:14px;z-index:60;box-shadow:0 8px 30px rgba(0,0,0,.25);max-width:92vw}
.muted{color:var(--muted)}
.mb{margin-bottom:14px}

.setup{max-width:560px;margin:40px auto}
.menu{position:relative}
</style>
</head>
<body>
<div id="root" class="app"><div class="empty">Loading…</div></div>
<div id="overlay"></div>
<div id="toast"></div>
<noscript>Transfer Queue needs JavaScript turned on.</noscript>
<script type="module" src="app.js"></script>
</body>
</html>
